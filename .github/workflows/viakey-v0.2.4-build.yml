name: ViaKey Android Build

on:
  push:
    branches:
      - ci/viakey-v0.2.4-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore ViaKey source
        shell: bash
        run: |
          mkdir -p /tmp/viakey-build
          cat viakey-ci/chunks/part*.txt | base64 --decode > /tmp/viakey.tar.xz
          tar -xJf /tmp/viakey.tar.xz -C /tmp/viakey-build
          test -f /tmp/viakey-build/settings.gradle.kts
          echo "ViaKey source restored."

      - name: Prepare 50k language dictionaries
        working-directory: /tmp/viakey-build
        run: python3 tools/prepare_frequency_words.py

      - name: Build debug APK
        working-directory: /tmp/viakey-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          test -f /tmp/viakey-build/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/viakey-build/app/build/outputs/apk/debug/app-debug.apk /tmp/ViaKeyAI_v0.2.4-debug.apk
          ls -lh /tmp/ViaKeyAI_v0.2.4-debug.apk
          sha256sum /tmp/ViaKeyAI_v0.2.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaKeyAI-v0.2.4-debug
          path: /tmp/ViaKeyAI_v0.2.4-debug.apk
          if-no-files-found: error
