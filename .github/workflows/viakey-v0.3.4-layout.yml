name: ViaKey 0.3.4 iOS Layout Build

on:
  push:
    branches:
      - ci/viakey-v0.3.4-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore ViaKey 0.3.4 source
        shell: bash
        run: |
          mkdir -p /tmp/viakey-build
          cat viakey-ci/layout034/part*.txt | base64 --decode > /tmp/viakey034.tar.xz
          tar -xJf /tmp/viakey034.tar.xz -C /tmp/viakey-build
          test -f /tmp/viakey-build/settings.gradle.kts
          grep -n 'versionName = "0.3.4"' /tmp/viakey-build/app/build.gradle.kts
          grep -n 'toolbarExpanded' /tmp/viakey-build/app/src/main/java/com/mova/viakey/ViaKeyService.kt

      - name: Prepare language dictionaries
        working-directory: /tmp/viakey-build
        run: python3 tools/prepare_frequency_words.py

      - name: Build standard and side-by-side APKs
        working-directory: /tmp/viakey-build
        run: gradle :app:assembleStandardDebug :app:assembleSideDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/viakey-build/app/build/outputs/apk/standard/debug/app-standard-debug.apk /tmp/out/ViaKeyAI_v0.3.4-standard-debug.apk
          cp /tmp/viakey-build/app/build/outputs/apk/side/debug/app-side-debug.apk /tmp/out/ViaKeyAI_v0.3.4_iOS_LAYOUT-side-by-side.apk
          sha256sum /tmp/out/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ViaKeyAI-v0.3.4-ios-layout-apks
          path: /tmp/out/*.apk
          if-no-files-found: error
