name: ViaKey Android Build

on:
  push:
    branches:
      - ci/viakey-v0.2.0-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore ViaKey source
        shell: bash
        run: |
          mkdir -p /tmp/viakey-build
          cat viakey-ci/chunks/part*.txt | base64 --decode > /tmp/viakey.zip
          unzip -q /tmp/viakey.zip -d /tmp/viakey-build
          test -f /tmp/viakey-build/ViaKeyAI_v0.2.0/settings.gradle.kts
          echo "Source restored."

      - name: Build debug APK
        working-directory: /tmp/viakey-build/ViaKeyAI_v0.2.0
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp /tmp/viakey-build/ViaKeyAI_v0.2.0/app/build/outputs/apk/debug/app-debug.apk /tmp/ViaKeyAI_v0.2.0-debug.apk
          sha256sum /tmp/ViaKeyAI_v0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaKeyAI-v0.2.0-debug
          path: /tmp/ViaKeyAI_v0.2.0-debug.apk
          if-no-files-found: error
