name: ViaKey 0.3.5 Tools Build

on:
  push:
    branches:
      - ci/viakey-v0.3.5-tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore ViaKey base
        shell: bash
        run: |
          mkdir -p /tmp/viakey-build
          cat viakey-ci/chunks/part*.txt | base64 --decode > /tmp/viakey.tar.xz
          tar -xJf /tmp/viakey.tar.xz -C /tmp/viakey-build
          test -f /tmp/viakey-build/settings.gradle.kts

      - name: Apply Typing Agent 0.3.1
        shell: bash
        run: |
          cp viakey-ci/agent031/TypingAgent.kt /tmp/viakey-build/app/src/main/java/com/mova/viakey/TypingAgent.kt
          python3 viakey-ci/agent031/apply_agent_patch.py

      - name: Apply Smooth Engine 0.3.2
        shell: bash
        run: python3 viakey-ci/smooth032/apply_smooth_patch.py

      - name: Apply iOS Renderer 0.3.3
        shell: bash
        run: python3 viakey-ci/ios033/apply_ios_renderer_patch.py

      - name: Apply iOS Geometry 0.3.4
        shell: bash
        run: python3 viakey-ci/layout034/apply_layout034.py

      - name: Apply Tools and Resize 0.3.5
        shell: bash
        run: |
          python3 viakey-ci/tools035/apply_tools035.py
          grep -n 'versionName = "0.3.5"' /tmp/viakey-build/app/build.gradle.kts
          grep -n 'Área de transferência' /tmp/viakey-build/app/src/main/java/com/mova/viakey/ViaKeyService.kt
          grep -n 'Redimensionar teclado' /tmp/viakey-build/app/src/main/java/com/mova/viakey/ViaKeyService.kt
          grep -n '"?123"' /tmp/viakey-build/app/src/main/java/com/mova/viakey/ViaKeyService.kt

      - name: Prepare dictionaries
        working-directory: /tmp/viakey-build
        run: python3 tools/prepare_frequency_words.py

      - name: Build standard and tools APKs
        working-directory: /tmp/viakey-build
        run: gradle :app:assembleStandardDebug :app:assembleSideDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/viakey-build/app/build/outputs/apk/standard/debug/app-standard-debug.apk /tmp/out/ViaKeyAI_v0.3.5-standard-debug.apk
          cp /tmp/viakey-build/app/build/outputs/apk/side/debug/app-side-debug.apk /tmp/out/ViaKeyAI_v0.3.5_iOS_TOOLS-side-by-side.apk
          sha256sum /tmp/out/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ViaKeyAI-v0.3.5-ios-tools-apks
          path: /tmp/out/*.apk
          if-no-files-found: error
