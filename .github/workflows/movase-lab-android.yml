name: Build MOVA-SE LAB Android

on:
  push:
    branches: [movase-lab-walk-v01]
    paths:
      - '.movase_build/**'
      - '.github/workflows/movase-lab-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore MOVA-SE source
        shell: bash
        run: |
          cat .movase_build/src0.b64 .movase_build/src1.b64 .movase_build/src2.b64 | base64 -d > movase-lab-src.tar.xz
          tar -xJf movase-lab-src.tar.xz
          test -f movase-lab/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: movase-lab
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp movase-lab/app/build/outputs/apk/debug/app-debug.apk MOVA-SE_LAB_Walk_0.1.apk

      - name: APK checksum
        run: sha256sum MOVA-SE_LAB_Walk_0.1.apk | tee MOVA-SE_LAB_Walk_0.1_SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVA-SE_LAB_Walk_0.1
          path: |
            MOVA-SE_LAB_Walk_0.1.apk
            MOVA-SE_LAB_Walk_0.1_SHA256.txt
          if-no-files-found: error
