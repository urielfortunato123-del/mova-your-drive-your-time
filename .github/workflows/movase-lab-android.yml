name: Build MOVA-SE LAB Android

on:
  push:
    branches: [movase-lab-walk-v01]
    paths:
      - '.movase_build/**'
      - '.github/workflows/movase-lab-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore MOVA-SE source
        shell: bash
        run: |
          cat .movase_build/src0.b64 .movase_build/src1.b64 .movase_build/src2.b64 | base64 -d > movase-lab-src.tar.xz
          tar -xJf movase-lab-src.tar.xz
          test -f movase-lab/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: movase-lab
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp movase-lab/app/build/outputs/apk/debug/app-debug.apk MOVA-SE_LAB_Walk_0.2.1_MAP_FIX.apk

      - name: APK checksum
        run: sha256sum MOVA-SE_LAB_Walk_0.2.1_MAP_FIX.apk | tee MOVA-SE_LAB_Walk_0.2.1_MAP_FIX_SHA256.txt

      - name: Collect apksig jar
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name 'apksig-*.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" apksig.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVA-SE_LAB_Walk_0.2.1_MAP_FIX
          path: |
            MOVA-SE_LAB_Walk_0.2.1_MAP_FIX.apk
            MOVA-SE_LAB_Walk_0.2.1_MAP_FIX_SHA256.txt
            apksig.jar
          if-no-files-found: error
